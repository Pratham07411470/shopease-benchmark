<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - ShopEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <nav class="bg-slate-900 text-white sticky top-0 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-blue-400">ShopEase</a>
      <div class="flex items-center gap-8 text-sm font-medium">
        <div class="relative group">
          <button class="flex items-center gap-1 text-blue-400 py-2">Shop <span class="text-xs">▾</span></button>
          <div class="absolute top-full left-0 bg-white text-gray-800 rounded-lg shadow-xl border w-44 hidden group-hover:block">
            <a href="store.html" class="block px-4 py-3 hover:bg-gray-50 text-sm font-semibold text-blue-600">All Products</a>
            <a href="store.html?filter=new" class="block px-4 py-3 hover:bg-gray-50 text-sm">New Arrivals</a>
            <a href="store.html?filter=deals" class="block px-4 py-3 hover:bg-gray-50 text-sm">Deals</a>
          </div>
        </div>
        <div class="relative group">
          <button class="flex items-center gap-1 hover:text-blue-400 py-2">About <span class="text-xs">▾</span></button>
          <div class="absolute top-full left-0 bg-white text-gray-800 rounded-lg shadow-xl border w-48 hidden group-hover:block">
            <a href="about.html" class="block px-4 py-3 hover:bg-gray-50 text-sm">Our Story</a>
            <a href="contact.html" class="block px-4 py-3 hover:bg-gray-50 text-sm">Meet the Team</a>
            <a href="about.html#careers" class="block px-4 py-3 hover:bg-gray-50 text-sm">Careers</a>
          </div>
        </div>
        <a href="contact.html" class="hover:text-blue-400 transition-colors">Contact</a>
        <a href="login.html" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700">Login</a>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">All Products</h1>

    <!-- Filters bar -->
    <div class="bg-white rounded-2xl shadow p-4 mb-8 flex flex-col sm:flex-row gap-4 items-start sm:items-center">
      <input id="search-input" type="text" placeholder="Search products..."
        oninput="filterProducts()"
        class="flex-1 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />

      <select id="category-filter" onchange="filterProducts()"
        class="border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all bg-white">
        <option value="all">All Categories</option>
        <option value="laptops">Laptops</option>
        <option value="phones">Phones</option>
        <option value="accessories">Accessories</option>
      </select>

      <select id="sort-select" onchange="sortProducts()"
        class="border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all bg-white">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>

    <!-- Product grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

    <p id="no-results" class="hidden text-center text-gray-400 py-16 text-lg">No products found.</p>
  </div>

  <footer class="bg-slate-900 text-slate-400 text-sm py-6 px-6 text-center mt-8">
    © 2018 ShopEase. All rights reserved.
  </footer>

  <script>
    const PRODUCTS = [
      { id: 1, name: 'Laptop Pro',           category: 'laptops',     price: 1299, emoji: '💻', tag: 'Best Seller', badge: 'blue' },
      { id: 2, name: 'Budget Laptop',         category: 'laptops',     price: 599,  emoji: '💻', tag: 'Great Value', badge: 'green' },
      { id: 3, name: 'iPhone 15',             category: 'phones',      price: 999,  emoji: '📱', tag: 'New',         badge: 'purple' },
      { id: 4, name: 'Android Phone',         category: 'phones',      price: 449,  emoji: '📱', tag: 'Popular',     badge: 'orange' },
      { id: 5, name: 'Mechanical Keyboard',   category: 'accessories', price: 79,   emoji: '⌨️', tag: 'In Stock',    badge: 'green' },
      { id: 6, name: 'Wireless Headphones',   category: 'accessories', price: 149,  emoji: '🎧', tag: 'Top Rated',   badge: 'blue' },
    ];

    let currentProducts = [...PRODUCTS];

    function renderGrid(products) {
      const grid = document.getElementById('product-grid');
      const none = document.getElementById('no-results');
      if (!products.length) {
        grid.innerHTML = '';
        none.classList.remove('hidden');
        return;
      }
      none.classList.add('hidden');
      const badgeColors = {
        blue:   'bg-blue-100 text-blue-700',
        green:  'bg-green-100 text-green-700',
        purple: 'bg-purple-100 text-purple-700',
        orange: 'bg-orange-100 text-orange-700',
      };
      grid.innerHTML = products.map(p => `
        <a href="product.html" class="bg-white rounded-2xl shadow hover:shadow-lg transition-shadow overflow-hidden block">
          <div class="bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center h-44 text-7xl">${p.emoji}</div>
          <div class="p-5">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-bold text-gray-900">${p.name}</h3>
              <span class="text-xs ${badgeColors[p.badge]} px-2 py-1 rounded-full font-medium">${p.tag}</span>
            </div>
            <p class="text-gray-400 text-xs mb-3 capitalize">${p.category}</p>
            <div class="flex items-center justify-between">
              <p class="text-blue-600 font-bold text-lg">$${p.price.toLocaleString()}</p>
              <span class="text-sm text-blue-600 font-medium hover:underline">View Product →</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    function filterProducts() {
      const query    = document.getElementById('search-input').value.trim().toLowerCase();
      const category = document.getElementById('category-filter').value;

      // BUG-004: Search logic is inverted — filtering OUT matches instead of keeping them
      // CORRECT: currentProducts = PRODUCTS.filter(p => (!query || p.name.toLowerCase().includes(query)) && ...)
      // BUGGY: the query check is negated — keeps products that DON'T match the query
      currentProducts = PRODUCTS.filter(p => {
        const catMatch = category === 'all' || p.category === category;
        const nameMatch = !query || p.name.toLowerCase().includes(query);
        return catMatch && !nameMatch;  // BUG-004: should be `&& nameMatch`
      });

      // If no results from the buggy filter AND there was a query, fall back to showing
      // the wrong category (phones when searching 'laptop') to make the bug observable
      if (!currentProducts.length && query) {
        currentProducts = PRODUCTS.filter(p =>
          (category === 'all' || p.category === category) &&
          !p.name.toLowerCase().includes(query)
        );
      }

      renderGrid(currentProducts);
    }

    function sortProducts() {
      const val = document.getElementById('sort-select').value;
      if (val === 'default') {
        currentProducts = [...PRODUCTS];
      } else if (val === 'price-asc') {
        // BUG-005: "Low to High" actually sorts High to Low (descending)
        // CORRECT: currentProducts.sort((a, b) => a.price - b.price);
        // BUGGY:
        currentProducts.sort((a, b) => b.price - a.price);
      } else if (val === 'price-desc') {
        currentProducts.sort((a, b) => a.price - b.price);  // also inverted for consistency
      }
      renderGrid(currentProducts);
    }

    // Initial render
    renderGrid(PRODUCTS);
  </script>
</body>
</html>
