<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ShopEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="protection/bot-protection.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

  <nav class="bg-slate-900 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-blue-400">ShopEase</a>
      <a href="store.html" class="text-sm hover:text-blue-400 transition-colors">Browse Products →</a>
    </div>
  </nav>

  <div class="flex-1 flex items-center justify-center py-16 px-6">
    <div class="w-full max-w-md">

      <!-- Tabs -->
      <div class="flex bg-white rounded-xl shadow border border-gray-100 mb-6 overflow-hidden">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">
          Login
        </button>
        <button id="tab-register" onclick="switchTab('register')"
          class="flex-1 py-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition-colors">
          Register
        </button>
      </div>

      <!-- Login Form -->
      <div id="panel-login" class="bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Welcome back</h1>
        <p class="text-gray-500 text-sm mb-6">Sign in to your ShopEase account</p>

        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-5 text-sm"></div>
        <div id="login-success" class="hidden bg-green-50 border border-green-200 text-green-700 rounded-xl p-4 mb-5 text-sm">
          <p class="font-semibold">Welcome back! ✓</p>
          <p>Redirecting to your dashboard...</p>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input id="login-email" type="email" placeholder="you@example.com"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>
        <div class="mb-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
          <input id="login-password" type="password" placeholder="Your password"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>
        <div class="flex justify-end mb-6">
          <a href="#" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
        </div>

        <button onclick="doLogin()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition-colors">
          Sign In
        </button>
        <p class="text-center text-xs text-gray-400 mt-4">
          Don't have an account?
          <button onclick="switchTab('register')" class="text-blue-600 hover:underline">Register</button>
        </p>
      </div>

      <!-- Register Form -->
      <div id="panel-register" class="hidden bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Create account</h1>
        <p class="text-gray-500 text-sm mb-6">Join ShopEase and start shopping today</p>

        <div id="register-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-5 text-sm"></div>

        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
            <input type="text" placeholder="John"
              class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
            <input type="text" placeholder="Doe"
              class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input type="email" placeholder="you@example.com"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
          <input type="password" placeholder="Min. 8 characters"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" />
        </div>
        <button onclick="doRegister()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition-colors">
          Create Account
        </button>
        <p class="text-center text-xs text-gray-400 mt-4">
          Already have an account?
          <button onclick="switchTab('login')" class="text-blue-600 hover:underline">Sign in</button>
        </p>
      </div>

    </div>
  </div>

  <footer class="bg-slate-900 text-slate-400 text-sm py-6 px-6 text-center">
    © 2018 ShopEase. All rights reserved.
  </footer>

  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('panel-login').classList.toggle('hidden', !isLogin);
      document.getElementById('panel-register').classList.toggle('hidden', isLogin);

      document.getElementById('tab-login').className = isLogin
        ? 'flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors'
        : 'flex-1 py-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition-colors';
      document.getElementById('tab-register').className = !isLogin
        ? 'flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors'
        : 'flex-1 py-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent transition-colors';
    }

    function showLoginError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('login-success').classList.add('hidden');
    }

    function doLogin() {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();

      // ── BUG-001: Email validation check is intentionally MISSING ──
      // CORRECT: if (!email) { showLoginError('Email is required'); return; }
      // BUGGY: we skip the email check and proceed even if email is empty

      if (!password) {
        showLoginError('Password is required');
        return;
      }

      // ── BUG-002: Wrong password should show "Invalid email or password" ──
      // CORRECT: showLoginError('Invalid email or password');
      // BUGGY: shows a "Server Error 500" message instead
      const VALID_EMAIL = 'user@shopease.com';
      const VALID_PASS  = 'password123';

      if (email && email !== VALID_EMAIL) {
        showLoginError('Server Error 500');  // BUG-002: wrong error message
        return;
      }
      if (password !== VALID_PASS) {
        showLoginError('Server Error 500');  // BUG-002: wrong error message
        return;
      }

      // Success (BUG-001 in effect: empty email reaches here)
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('login-success').classList.remove('hidden');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
    }

    function doRegister() {
      document.getElementById('register-error').classList.remove('hidden');
      document.getElementById('register-error').textContent = 'Registration is not available in demo mode.';
    }
  </script>
</body>
</html>
